name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set manifest version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag $TAG is not a version" >&2
            exit 1
          fi
          jq --arg v "$version" '.version = $v' custom_components/marstek/manifest.json > manifest.json
          mv manifest.json custom_components/marstek/manifest.json
      - name: Package integration
        working-directory: custom_components/marstek
        run: zip -r "$GITHUB_WORKSPACE/marstek.zip" . -x '__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" marstek.zip --title "$TAG" --generate-notes --verify-tag
