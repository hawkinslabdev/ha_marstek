name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "$VERSION is not a version" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Set manifest version
        run: |
          jq --arg v "$VERSION" '.version = $v' custom_components/marstek_hacs/manifest.json > manifest.json
          mv manifest.json custom_components/marstek_hacs/manifest.json
      - name: Package integration
        working-directory: custom_components/marstek_hacs
        run: zip -r "$GITHUB_WORKSPACE/marstek.zip" . -x '__pycache__/*'
      - name: Generate release notes
        run: |
          PREV=$(gh release view --json tagName --jq .tagName)
          {
            echo "### Changes"
            echo
            gh api "repos/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_SHA" --jq '
              def rank: if test("^feat[(!:]") then 0 elif test("^fix[(!:]") then 1
                elif test("^security[(!:]"; "i") then 2 elif test("^chore[(!:]") then 3 else 4 end;
              [.commits[] | select(.parents | length == 1)
                | {s: (.commit.message | split("\n")[0]), h: .sha[0:7], a: (.author.login // .commit.author.name)}]
              | sort_by(.s | rank) | .[] | "* [x] \(.s) from \(.h) by @\(.a)"'
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...v$VERSION"
          } > release_notes.md
      - name: Tag and publish release
        run: gh release create "v$VERSION" marstek.zip --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release_notes.md
