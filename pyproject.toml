[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "D", "E", "F", "I", "PERF", "PL", "PT", "RUF", "SIM", "UP", "W"]
ignore = ["D202", "D203", "D212", "E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["homeassistant"]
known-local-folder = ["custom_components"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC2701", "SLF001"]
